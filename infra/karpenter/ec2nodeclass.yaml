apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: np-app
spec:
  role: KarpenterNodeRole-${EKS_CLUSTER_NAME}
  # Pinned AMI release; bump deliberately.
  amiSelectorTerms:
    - alias: al2023@v20260930
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${EKS_CLUSTER_NAME}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${EKS_CLUSTER_NAME}
  # IMDSv2 only, hop limit 1: pods cannot reach the node role credentials.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
