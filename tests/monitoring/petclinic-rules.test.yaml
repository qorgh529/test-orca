# promtool unit tests for k8s/monitoring/prometheusrule-petclinic.yaml. Run: scripts/test-prometheus-rules.sh
# Series start at t=0 (epoch); kube_cronjob_created=0 means the CronJob was created at t=0.
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  # Never succeeded: silent for 26h after creation, then fires.
  - interval: 1h
    input_series:
      - series: 'kube_cronjob_created{namespace="petclinic", cronjob="db-backup"}'
        values: '0x30'
    alert_rule_test:
      - { eval_time: 25h, alertname: PetClinicDBBackupFailed, exp_alerts: [] }
      - eval_time: 27h
        alertname: PetClinicDBBackupFailed
        exp_alerts:
          - exp_labels: { severity: critical, namespace: petclinic, cronjob: db-backup }
            exp_annotations: { summary: "petclinic db-backup has not succeeded for over 26h" }

  # Last success at t=0: fires once it is over 26h old, clears after the next success (t=28h, value 100800).
  - interval: 1h
    input_series:
      - series: 'kube_cronjob_created{namespace="petclinic", cronjob="db-backup"}'
        values: '0x30'
      - series: 'kube_cronjob_status_last_successful_time{namespace="petclinic", cronjob="db-backup"}'
        values: '0x27 100800x3'
    alert_rule_test:
      - { eval_time: 26h, alertname: PetClinicDBBackupFailed, exp_alerts: [] }
      - eval_time: 27h
        alertname: PetClinicDBBackupFailed
        exp_alerts:
          - exp_labels: { severity: critical, namespace: petclinic, cronjob: db-backup }
            exp_annotations: { summary: "petclinic db-backup has not succeeded for over 26h" }
      - { eval_time: 28h, alertname: PetClinicDBBackupFailed, exp_alerts: [] }

  # PetClinicHttp5xxRateHigh. 4xx only: 30% 404s (70 x 200 + 30 x 404 per minute) never count as 5xx.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="petclinic-was", http_response_status_code="200"}'
        values: '0+70x15'
      - series: 'http_server_request_duration_seconds_count{service_name="petclinic-was", http_response_status_code="404"}'
        values: '0+30x15'
    alert_rule_test:
      - { eval_time: 5m, alertname: PetClinicHttp5xxRateHigh, exp_alerts: [] }
      - { eval_time: 10m, alertname: PetClinicHttp5xxRateHigh, exp_alerts: [] }

  # Low traffic, as on 2026-10-27 after daily-start: ~0.17 req/s with 30% 404s (7 x 200 + 3 x 404 per minute).
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="petclinic-was", http_response_status_code="200"}'
        values: '0+7x15'
      - series: 'http_server_request_duration_seconds_count{service_name="petclinic-was", http_response_status_code="404"}'
        values: '0+3x15'
    alert_rule_test:
      - { eval_time: 5m, alertname: PetClinicHttp5xxRateHigh, exp_alerts: [] }
      - { eval_time: 10m, alertname: PetClinicHttp5xxRateHigh, exp_alerts: [] }

  # Actual 5xx: 10% 500s (90 x 200 + 10 x 500 per minute) until t=10m. Pending from t=1m, fires after 5m,
  # clears once the 500s have left the 5m window.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="petclinic-was", http_response_status_code="200"}'
        values: '0+90x20'
      - series: 'http_server_request_duration_seconds_count{service_name="petclinic-was", http_response_status_code="500"}'
        values: '0+10x10 100x10'
    alert_rule_test:
      - { eval_time: 5m, alertname: PetClinicHttp5xxRateHigh, exp_alerts: [] }
      - eval_time: 6m
        alertname: PetClinicHttp5xxRateHigh
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "petclinic WAS 5xx error responses above 5% for 5m" }
      - eval_time: 10m
        alertname: PetClinicHttp5xxRateHigh
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "petclinic WAS 5xx error responses above 5% for 5m" }
      - { eval_time: 16m, alertname: PetClinicHttp5xxRateHigh, exp_alerts: [] }
