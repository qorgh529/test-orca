# Server block template. ${WAS_UPSTREAM_HOST}/${WAS_UPSTREAM_PORT} are filled by envsubst at start.
server {
    listen 8080;
    server_tokens off;
    # Relative Location on Nginx's own redirects (/was -> /was/): an absolute one would carry this
    # listener's scheme and port (http://<host>:8080), not the https the client used at the ALB.
    absolute_redirect off;

    # Security headers. Locations below must not use add_header, or these stop being inherited;
    # `expires` sets Cache-Control without breaking inheritance.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Scraped by the nginx-prometheus-exporter sidecar in the same pod only.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    root /usr/share/nginx/html;

    # Public pages (docs/features/landing-page/design.md): / and its assets are served here, so
    # they stay up when WAS or DB is down. Anything else that is not a file gets the 404 page.
    error_page 404 /404.html;

    location = / {
        index index.html;
        expires 1h;
    }

    location / {
        try_files $uri =404;
        expires 1h;
    }

    location /resources/ {
        expires 7d;
    }

    location /webjars/ {
        expires 30d;
    }

    # The app runs under /was; its <spring:url> links point at /was/resources/ and /was/webjars/.
    location /was/resources/ {
        alias /usr/share/nginx/html/resources/;
        expires 7d;
    }

    location /was/webjars/ {
        alias /usr/share/nginx/html/webjars/;
        expires 30d;
    }

    location = /was {
        return 301 /was/;
    }

    # NGF sets X-Forwarded-Proto to its own scheme (http), and the ALB only lets https through
    # (80 redirects to 443), so the proto and port are fixed here for Tomcat's RemoteIpValve.
    location /was/ {
        proxy_pass http://${WAS_UPSTREAM_HOST}:${WAS_UPSTREAM_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
