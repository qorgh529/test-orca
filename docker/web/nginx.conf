# Server block template. ${WAS_UPSTREAM_HOST}/${WAS_UPSTREAM_PORT} are filled by envsubst at start.
server {
    listen 8080;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Scraped by the nginx-prometheus-exporter sidecar in the same pod only.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    location /resources/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /webjars/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://${WAS_UPSTREAM_HOST}:${WAS_UPSTREAM_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
