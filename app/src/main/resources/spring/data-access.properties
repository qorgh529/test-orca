# Properties file with JDBC and JPA settings.
#
# Applied by <context:property-placeholder location="jdbc.properties"/> from
# various application context XML files (e.g., "applicationContext-*.xml").
# Targeted at system administrators, to avoid touching the context XML files.

# Properties that control the population of schema and data for a new data source
jdbc.initLocation=classpath:db/${db.script}/schema.sql
jdbc.dataLocation=classpath:db/${db.script}/data.sql
jdbc.initEnabled=${jdbc.initEnabled}

# Off by default: SQL logs would ship owner PII to CloudWatch. Override with JPA_SHOWSQL=true.
jpa.showSql=false

# Values below are Maven-filtered build defaults (MySQL profile: no credentials).
# At runtime they are overridden by env vars JDBC_URL / JDBC_USERNAME / JDBC_PASSWORD
# (Spring relaxed binding) or -Djdbc.* system properties set by docker/was/setenv.sh.
jdbc.driverClassName=${jdbc.driverClassName}
jdbc.url=${jdbc.url}
jdbc.username=${jdbc.username}
jdbc.password=${jdbc.password}

# Per-pod connection cap: was-stable 10 + was-canary 3 pods (+ rolling surge) stay well under
# db.t3.medium max_connections (design §4.x connection budget).
jdbc.pool.maxActive=10
jdbc.pool.maxIdle=5
jdbc.pool.minIdle=2
jdbc.pool.initialSize=2
jdbc.pool.maxWait=5000
jdbc.pool.validationQuery=SELECT 1

# Property that determines which database to use with an AbstractJpaVendorAdapter
jpa.database=${jpa.database}
