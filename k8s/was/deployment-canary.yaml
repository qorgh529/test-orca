# Image is CANARY_IMAGE_TAG; scripts/deploy-all.sh rolls it out at 0% traffic and opens 10% only after a check.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: was-canary
  namespace: petclinic
  labels: { app: was, track: canary }
spec:
  replicas: 1
  selector:
    matchLabels: { app: was, track: canary }
  template:
    metadata:
      labels: { app: was, track: canary }
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload-tier: app
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: was, track: canary }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tomcat
          image: ${ECR_WAS_REPOSITORY_URI}:${CANARY_IMAGE_TAG}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9404 }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: jpa }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=75.0" }
            - name: JDBC_URL
              valueFrom: { secretKeyRef: { name: petclinic-rds-secret, key: JDBC_URL } }
            - name: JDBC_USERNAME
              valueFrom: { secretKeyRef: { name: petclinic-rds-secret, key: JDBC_USERNAME } }
            - name: JDBC_PASSWORD
              valueFrom: { secretKeyRef: { name: petclinic-rds-secret, key: JDBC_PASSWORD } }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          # Tomcat's only writable paths; the app itself ships pre-unpacked in webapps/ROOT.
          volumeMounts:
            - { name: work, mountPath: /usr/local/tomcat/work }
            - { name: temp, mountPath: /usr/local/tomcat/temp }
            - { name: logs, mountPath: /usr/local/tomcat/logs }
            - { name: catalina-conf, mountPath: /usr/local/tomcat/conf/Catalina }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: work, emptyDir: {} }
        - { name: temp, emptyDir: {} }
        - { name: logs, emptyDir: {} }
        - { name: catalina-conf, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
