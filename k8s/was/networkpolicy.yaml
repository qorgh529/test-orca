# was accepts traffic only from web (8080) and Prometheus (9404).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: was-ingress
  namespace: petclinic
spec:
  podSelector:
    matchLabels: { app: was }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: web }
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
          podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports:
        - { protocol: TCP, port: 9404 }
