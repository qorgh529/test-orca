apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: petclinic
  labels: { app: web, track: stable, metrics: nginx }
spec:
  selector: { app: web, track: stable }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9113, targetPort: metrics }
---
apiVersion: v1
kind: Service
metadata:
  name: web-canary
  namespace: petclinic
  labels: { app: web, track: canary, metrics: nginx }
spec:
  selector: { app: web, track: canary }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9113, targetPort: metrics }
