# web (stable) proxies to was-stable; web-canary proxies to was-canary.
# The HTTPRoute weights between them decide the canary share (k8s/gateway/httproute-canary.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: petclinic
  labels: { app: web, track: stable }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web, track: stable }
  template:
    metadata:
      labels: { app: web, track: stable }
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload-tier: app
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: web, track: stable }
          matchLabelKeys: [pod-template-hash]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ${ECR_WEB_REPOSITORY_URI}:${STABLE_IMAGE_TAG}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: WAS_UPSTREAM_HOST, value: was-stable }
            - { name: WAS_UPSTREAM_PORT, value: "8080" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: &hardened
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
            - { name: confd, mountPath: /etc/nginx/conf.d }
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args: ["--nginx.scrape-uri=http://127.0.0.1:8080/nginx_status"]
          ports:
            - { name: metrics, containerPort: 9113 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext: *hardened
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: confd, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
  namespace: petclinic
  labels: { app: web, track: canary }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web, track: canary }
  template:
    metadata:
      labels: { app: web, track: canary }
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload-tier: app
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: web, track: canary }
          matchLabelKeys: [pod-template-hash]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ${ECR_WEB_REPOSITORY_URI}:${CANARY_IMAGE_TAG}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: WAS_UPSTREAM_HOST, value: was-canary }
            - { name: WAS_UPSTREAM_PORT, value: "8080" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: &hardened
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
            - { name: confd, mountPath: /etc/nginx/conf.d }
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args: ["--nginx.scrape-uri=http://127.0.0.1:8080/nginx_status"]
          ports:
            - { name: metrics, containerPort: 9113 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext: *hardened
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: confd, emptyDir: {} }
