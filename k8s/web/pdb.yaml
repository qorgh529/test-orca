# Keep one stable web pod during node drains / Karpenter consolidation. No PDB for web-canary:
# with a single replica, minAvailable 1 would block every drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: petclinic
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: web, track: stable }
