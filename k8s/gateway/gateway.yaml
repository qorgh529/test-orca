# GatewayClass `nginx` is installed by the NGF Helm chart; its pods are pinned to np-app
# via Helm values in scripts/deploy-all.sh.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: petclinic-gateway
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          # petclinic: the app routes. nginx-gateway: the /grafana route (httproute-grafana.yaml).
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [petclinic, nginx-gateway]
