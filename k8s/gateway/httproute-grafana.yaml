# https://${DOMAIN_NAME}/grafana/ -> Grafana (docs/features/grafana-public-path/design.md).
# Only the operators' IPs get here: the WAF rule BlockUnauthorizedGrafanaAccess (provision-aws-resources.sh
# grafana-waf) answers 403 to everyone else. The longer /grafana prefix wins over the app's / route, so
# the canary split and X-Canary never apply to it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: petclinic-gateway
      namespace: nginx-gateway
      sectionName: http
  rules:
    - matches:
        - path: { type: PathPrefix, value: /grafana }
      backendRefs:
        - name: kube-prometheus-stack-grafana
          namespace: monitoring
          port: 80
