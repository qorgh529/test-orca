# No `auth` block: ESO uses the controller's IRSA role (external-secrets/external-secrets SA),
# which may only read arn:...:secret:petclinic/*. The controller itself runs on ng-critical.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: petclinic
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
