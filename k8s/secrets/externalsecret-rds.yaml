apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: petclinic-rds
  namespace: petclinic
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: petclinic-rds-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RDS_HOST: "{{ .host }}"
        RDS_PORT: "{{ .port }}"
        RDS_DB_NAME: "{{ .dbname }}"
        JDBC_URL: "jdbc:mysql://{{ .host }}:{{ .port }}/{{ .dbname }}?useUnicode=true&sslMode=REQUIRED"
        JDBC_USERNAME: "{{ .username }}"
        JDBC_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: ${RDS_SECRET_NAME}
