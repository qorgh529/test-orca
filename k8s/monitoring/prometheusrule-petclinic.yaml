# Alerts routed to the webhook in ALERTMANAGER_WEBHOOK_SECRET_NAME (kube-prometheus-values.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: petclinic
  namespace: monitoring
spec:
  groups:
    - name: petclinic
      rules:
        # Daily CronJob: no success for 26h covers both failed and missed runs, and clears itself on the next success.
        # kube-state-metrics omits last_successful_time until the first success, so a CronJob that never
        # succeeded is measured from its creation instead. Tested by scripts/test-prometheus-rules.sh.
        - alert: PetClinicDBBackupFailed
          expr: |
            (time() - kube_cronjob_status_last_successful_time{namespace="petclinic", cronjob="db-backup"} > 26 * 3600)
            or
            (time() - kube_cronjob_created{namespace="petclinic", cronjob="db-backup"} > 26 * 3600
              unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{namespace="petclinic", cronjob="db-backup"})
          labels: { severity: critical }
          annotations:
            summary: "petclinic db-backup has not succeeded for over 26h"
        # Scaling queries to Prometheus are failing; was runs on the ScaledObject fallback (4 replicas).
        # Scraped from the keda namespace without honorLabels, so the metric's own namespace label
        # arrives as exported_namespace.
        - alert: PetClinicKedaMetricsError
          expr: sum by (scaledObject) (increase(keda_scaled_object_errors_total{exported_namespace="petclinic"}[5m])) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "KEDA cannot read metrics for ScaledObject {{ $labels.scaledObject }}"
        # OTel Java agent RED metric (via the OTel Collector), not Tomcat errorCount: errorCount counts
        # every status >= 400, so a few 404s at low traffic paged as 5xx. Same query as the APM dashboard.
        # No traffic gives 0/0 = NaN and no 5xx series gives an empty result: neither fires.
        - alert: PetClinicHttp5xxRateHigh
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="petclinic-was", http_response_status_code=~"5.."}[5m]))
              / sum(rate(http_server_request_duration_seconds_count{service_name="petclinic-was"}[5m])) > 0.05
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "petclinic WAS 5xx error responses above 5% for 5m"
