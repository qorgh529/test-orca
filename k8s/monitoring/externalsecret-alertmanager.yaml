# Alertmanager webhook URL (often embeds a token). Mounted into Alertmanager via alertmanagerSpec.secrets
# and read with url_file, so it never appears in Helm values or the Alertmanager config Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: alertmanager-webhook
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: ${ALERTMANAGER_WEBHOOK_SECRET_NAME}
        property: url
