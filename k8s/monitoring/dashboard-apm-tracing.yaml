# Grafana APM dashboard, loaded by the kube-prometheus-stack dashboard sidecar (label grafana_dashboard: "1").
apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-apm-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  petclinic-apm.json: |
    {
      "uid": "petclinic-apm",
      "title": "PetClinic APM - Service & Canary Tracing",
      "schemaVersion": 39,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "tags": [
        "petclinic",
        "apm"
      ],
      "panels": [
        {
          "type": "timeseries",
          "title": "Request rate by version",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service_version) (rate(http_server_request_duration_seconds_count{service_name=\"petclinic-was\"}[5m]))",
              "legendFormat": "{{service_version}}",
              "exemplar": false
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "5xx error rate by version",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service_version) (rate(http_server_request_duration_seconds_count{service_name=\"petclinic-was\", http_response_status_code=~\"5..\"}[5m])) / sum by (service_version) (rate(http_server_request_duration_seconds_count{service_name=\"petclinic-was\"}[5m]))",
              "legendFormat": "{{service_version}}",
              "exemplar": false
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency p95 / p99 by version (exemplars -> Tempo)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, service_version) (rate(http_server_request_duration_seconds_bucket{service_name=\"petclinic-was\"}[5m])))",
              "legendFormat": "p95 {{service_version}}",
              "exemplar": true
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.99, sum by (le, service_version) (rate(http_server_request_duration_seconds_bucket{service_name=\"petclinic-was\"}[5m])))",
              "legendFormat": "p99 {{service_version}}",
              "exemplar": true
            }
          ]
        },
        {
          "type": "table",
          "title": "Recent traces",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "traceql",
              "query": "{ resource.service.name = \"petclinic-was\" }",
              "limit": 20
            }
          ]
        }
      ]
    }
