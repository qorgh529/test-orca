# Prometheus has no auth: only KEDA (scaling queries) and Grafana may query it.
# Prometheus pods may reach themselves (self-scrape of :9090 and the config-reloader on :8080).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: keda }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: grafana }
      ports:
        - { protocol: TCP, port: 9090 }
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports:
        - { protocol: TCP, port: 9090 }
        - { protocol: TCP, port: 8080 }
