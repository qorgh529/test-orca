# kube-prometheus-stack 92.x (Prometheus v3, Grafana chart 14) — everything pinned to ng-platform, state on encrypted gp3 PVCs.
# Rendered with envsubst by scripts/deploy-all.sh.
x-platform: &platform
  nodeSelector:
    workload-tier: platform
  tolerations:
    - key: node-role
      operator: Equal
      value: platform
      effect: NoSchedule

prometheus:
  prometheusSpec:
    <<: *platform
    retention: 15d
    # Exemplars (trace_id) from the OTel collector's OpenMetrics endpoint -> Grafana links to Tempo.
    enableFeatures: [exemplar-storage]
    # One replica per AZ, each with its own gp3 PVC: an AZ outage leaves metrics and KEDA scaling up.
    replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
    # Pick up ServiceMonitors without the Helm release label (servicemonitor-petclinic.yaml).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  # Replaces the chart default config. Watchdog/InfoInhibitor fire by design and go nowhere.
  config:
    route:
      receiver: webhook
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
    receivers:
      - name: "null"
      - name: webhook
        # The URL is a Slack incoming webhook (channel fixed by the webhook), which rejects the generic
        # webhook_configs JSON with 400 no_text; slack_configs sends the text/attachments Slack expects.
        slack_configs:
          # From Secrets Manager via externalsecret-alertmanager.yaml (mounted by alertmanagerSpec.secrets).
          - api_url_file: /etc/alertmanager/secrets/alertmanager-webhook/url
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Labels.severity }}* {{ .Labels.namespace }} {{ .Labels.pod }}
              {{ with .Annotations.summary }}{{ . }}{{ else }}{{ .Annotations.description }}{{ end }}
              {{ end }}
  alertmanagerSpec:
    <<: *platform
    secrets: [alertmanager-webhook]
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  <<: *platform
  admin:
    # Synced from Secrets Manager (${GRAFANA_ADMIN_SECRET_NAME}) by externalsecret-grafana.yaml.
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi
  # Served at https://${DOMAIN_NAME}/grafana/ (docs/features/grafana-public-path/design.md); the WAF
  # lets only GRAFANA_ALLOWED_CIDRS reach it. Cookies stay on /grafana/, HTTPS-only.
  grafana.ini:
    server:
      domain: ${DOMAIN_NAME}
      root_url: https://${DOMAIN_NAME}/grafana/
      serve_from_sub_path: true
    security:
      cookie_secure: true
      cookie_samesite: lax
      allow_embedding: false
    users:
      allow_sign_up: false
    auth:
      login_maximum_inactive_lifetime_duration: 4h
      login_maximum_lifetime_duration: 24h
    auth.anonymous:
      enabled: false
  sidecar:
    datasources:
      # Exemplar trace_id on the default Prometheus datasource opens the trace in Tempo.
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      jsonData:
        httpMethod: GET
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true

# EKS runs the control plane outside the cluster: these targets can never be scraped and their
# *Down alerts would fire forever.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

prometheusOperator:
  <<: *platform
  admissionWebhooks:
    patch:
      <<: *platform

kube-state-metrics:
  <<: *platform

prometheus-node-exporter:
  tolerations:
    - operator: Exists
