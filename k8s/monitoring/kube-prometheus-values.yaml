# kube-prometheus-stack 65.x — everything pinned to ng-platform, state on encrypted gp3 PVCs.
# Rendered with envsubst by scripts/deploy-all.sh.
x-platform: &platform
  nodeSelector:
    workload-tier: platform
  tolerations:
    - key: node-role
      operator: Equal
      value: platform
      effect: NoSchedule

prometheus:
  prometheusSpec:
    <<: *platform
    retention: 15d
    # One replica per AZ, each with its own gp3 PVC: an AZ outage leaves metrics and KEDA scaling up.
    replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
    # Pick up ServiceMonitors without the Helm release label (servicemonitor-petclinic.yaml).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  # Replaces the chart default config. Watchdog/InfoInhibitor fire by design and go nowhere.
  config:
    route:
      receiver: webhook
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
    receivers:
      - name: "null"
      - name: webhook
        webhook_configs:
          - url: "${ALERTMANAGER_WEBHOOK_URL}"
            send_resolved: true
  alertmanagerSpec:
    <<: *platform
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  <<: *platform
  admin:
    # Synced from Secrets Manager (${GRAFANA_ADMIN_SECRET_NAME}) by externalsecret-grafana.yaml.
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi

prometheusOperator:
  <<: *platform
  admissionWebhooks:
    patch:
      <<: *platform

kube-state-metrics:
  <<: *platform

prometheus-node-exporter:
  tolerations:
    - operator: Exists
